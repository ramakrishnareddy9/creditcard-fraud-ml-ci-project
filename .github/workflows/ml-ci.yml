
name: Credit Card Fraud Detection ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dataset exists
        run: |
          test -f data/creditcard.csv.gz || test -f data/creditcard.csv

      - name: Train and evaluate model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Upload model, metrics and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraud-detection-results
          path: artifacts/
          if-no-files-found: warn
